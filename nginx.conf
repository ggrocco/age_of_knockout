server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/javascript;

  # Dokploy serves this under /eof; accept the prefix whether or not the proxy strips it.
  location = /eof { return 301 /eof/; }
  location /eof/ { rewrite ^/eof/(.*)$ /$1 last; }

  # The game's own files keep their names across deploys, so caches (browser and Cloudflare, which otherwise
  # keeps them for 4h) must revalidate each load; unchanged files come back as a cheap 304.
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
  # /v/<hash>/ is the versioned path the Dockerfile writes into the pages; a hash's content never changes.
  location /v/ { rewrite ^/v/[^/]+/(.*)$ /$1 break; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /node_modules/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
