# Publishes the game to GitHub Pages on every push to main (enable it once under Settings > Pages > Source:
# GitHub Actions). Ships the same files as the Dockerfile's nginx stage.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The same files as the Dockerfile's nginx stage, game files under v/<content hash>/ (see the script)
      - run: bash scripts/build-site.sh _site
      # Never deploy a site that does not start: the browser smoke test CI runs on pull requests, on these files
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node test/tools/browser-smoke.js _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ leaves dotfiles out by default; keep .nojekyll in the site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
